name: End-to-End Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        run: |
          wget -qO- https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          use-mamba: true
          channels: conda-forge, bioconda, defaults

      - name: Run pipeline on test data
        run: |
          nextflow run main.nf

      - name: "Verify KO_correct result (expected: PASS)"
        run: grep -q "PASS" results/marker_check/KO_correct.marker_check.csv || (echo "KO_correct should be PASS" && exit 1)

      - name: "Verify KO_ectopic result (expected: REVIEW)"
        run: grep -q "REVIEW" results/marker_check/KO_ectopic.marker_check.csv || (echo "KO_ectopic should be REVIEW" && exit 1)

      - name: "Verify WT result (expected: FAIL)"
        run: grep -q "FAIL" results/marker_check/WT.marker_check.csv || (echo "WT should be FAIL" && exit 1)

      - name: "Verify WT_ectopic result (expected: FAIL)"
        run: grep -q "FAIL" results/marker_check/WT_ectopic.marker_check.csv || (echo "WT_ectopic should be REVIEW" && exit 1)
