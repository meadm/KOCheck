name: kocheck
channels:
  - bioconda
  - conda-forge
dependencies:
  # Core workflow
  - nextflow>=22.10.0
  
  # Bioinformatics tools
  - fastp
  - bwa
  - samtools
  - mosdepth
  
  # Python and utilities
  - python>=3.8
  - pip
  
  # For GUI wrapper
  - tkinter
  
  # Additional utilities
  - bedtools
  - seqkit

# pip dependencies (if needed)
pip:
  - pillow
  - matplotlib
